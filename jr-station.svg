<svg xmlns="http://www.w3.org/2000/svg"
     width="1536"
     height="470"
     viewBox="0 0 1536 470"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Supaio Station</title>
  <desc id="desc">
    A Japanese railway station sign inspired by the classic Tokyo Station layout.
  </desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#fbfbfa"/>
      <stop offset="1" stop-color="#f0f1ef"/>
    </linearGradient>

    <linearGradient id="currentStation" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13c9e8"/>
      <stop offset="1" stop-color="#00a8ce"/>
    </linearGradient>

    <filter id="boardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity=".48"
      />
    </filter>

    <style>
      .sans {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .jp {
        font-family:
          "Noto Sans JP",
          "Yu Gothic",
          "Hiragino Sans",
          "Microsoft YaHei",
          sans-serif;
      }
    </style>
  </defs>

  <!-- 黑色站牌外框 -->
  <rect
    width="1536"
    height="470"
    rx="12"
    fill="#111111"
  />

  <!-- 白色灯箱 -->
  <g filter="url(#boardShadow)">
    <rect
      x="28"
      y="24"
      width="1480"
      height="420"
      fill="url(#panel)"
      stroke="#333333"
      stroke-width="5"
    />
  </g>

  <!-- 当前站编号 -->
  <g>
    <rect
      x="365"
      y="47"
      width="148"
      height="181"
      rx="24"
      fill="#111111"
    />

    <text
      class="sans"
      x="439"
      y="89"
      text-anchor="middle"
      fill="#ffffff"
      font-size="38"
      font-weight="800"
      letter-spacing="3"
    >
      SUP
    </text>

    <rect
      x="379"
      y="96"
      width="120"
      height="116"
      rx="8"
      fill="#09bfe2"
    />

    <rect
      x="390"
      y="107"
      width="98"
      height="94"
      rx="3"
      fill="#ffffff"
    />

    <text
      class="sans"
      x="439"
      y="150"
      text-anchor="middle"
      fill="#181818"
      font-size="31"
      font-weight="800"
    >
      CS
    </text>

    <text
      class="sans"
      x="439"
      y="191"
      text-anchor="middle"
      fill="#181818"
      font-size="43"
      font-weight="800"
    >
      01
    </text>
  </g>

  <!-- 主站名 -->
  <g fill="#111111">
    <text
      class="sans"
      x="780"
      y="156"
      text-anchor="middle"
      font-size="105"
      font-weight="900"
      letter-spacing="7"
    >
      SUPAIO
    </text>

    <text
      class="jp"
      x="780"
      y="218"
      text-anchor="middle"
      font-size="39"
      font-weight="800"
      letter-spacing="10"
    >
      すぱいお
    </text>
  </g>

  <!-- 右侧说明 -->
  <g fill="#222222">
    <text
      class="sans"
      x="1063"
      y="102"
      font-size="29"
      font-weight="700"
    >
      Computer
    </text>

    <text
      class="sans"
      x="1063"
      y="149"
      font-size="29"
      font-weight="700"
    >
      Science
    </text>
  </g>

  <!-- 学生标记 -->
  <g
    class="jp"
    font-size="42"
    font-weight="800"
    text-anchor="middle"
  >
    <rect
      x="1288"
      y="57"
      width="62"
      height="62"
      rx="5"
      fill="#ffffff"
      stroke="#222222"
      stroke-width="5"
    />

    <text
      x="1319"
      y="103"
      fill="#222222"
    >
      学
    </text>

    <rect
      x="1369"
      y="57"
      width="62"
      height="62"
      rx="5"
      fill="#222222"
    />

    <rect
      x="1375"
      y="63"
      width="50"
      height="50"
      rx="2"
      fill="#ffffff"
    />

    <text
      x="1400"
      y="103"
      fill="#222222"
    >
      生
    </text>
  </g>

  <!-- 绿色线路方向带 -->
  <path
    d="M46 309 L104 268 H720 V350 H104 Z"
    fill="#087f23"
  />

  <!-- 当前站青色标记 -->
  <rect
    x="720"
    y="268"
    width="96"
    height="82"
    fill="url(#currentStation)"
  />

  <!-- 右侧线路 -->
  <rect
    x="816"
    y="268"
    width="692"
    height="82"
    fill="#087f23"
  />

  <!-- 左侧相邻站 -->
  <text
    class="jp"
    x="224"
    y="330"
    text-anchor="middle"
    fill="#ffffff"
    font-size="57"
    font-weight="800"
    letter-spacing="5"
  >
    好奇心
  </text>

  <!-- 右侧相邻站 -->
  <text
    class="jp"
    x="1320"
    y="330"
    text-anchor="middle"
    fill="#ffffff"
    font-size="57"
    font-weight="800"
    letter-spacing="5"
  >
    構築
  </text>

  <!-- 左侧站号与英文名 -->
  <g>
    <rect
      x="91"
      y="365"
      width="65"
      height="65"
      rx="5"
      fill="#ffffff"
      stroke="#09bfe2"
      stroke-width="5"
    />

    <text
      class="sans"
      x="123.5"
      y="392"
      text-anchor="middle"
      fill="#222222"
      font-size="18"
      font-weight="800"
    >
      CS
    </text>

    <text
      class="sans"
      x="123.5"
      y="421"
      text-anchor="middle"
      fill="#222222"
      font-size="27"
      font-weight="800"
    >
      00
    </text>

    <text
      class="sans"
      x="176"
      y="416"
      fill="#222222"
      font-size="42"
      font-weight="500"
    >
      Curiosity
    </text>
  </g>

  <!-- 当前站英文名 -->
  <text
    class="sans"
    x="768"
    y="420"
    text-anchor="middle"
    fill="#111111"
    font-size="51"
    font-weight="800"
  >
    Supaio
  </text>

  <!-- 右侧站英文名 -->
  <text
    class="sans"
    x="1320"
    y="416"
    text-anchor="middle"
    fill="#222222"
    font-size="42"
    font-weight="500"
  >
    Build
  </text>

</svg>
    <text class="latin" x="28" y="340" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="2">PLATFORM 01 · KEEP CURIOSITY BEHIND THE YELLOW LINE</text>
  </g>
</svg>
