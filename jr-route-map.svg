<svg xmlns="http://www.w3.org/2000/svg"
     width="1536"
     height="850"
     viewBox="0 0 1536 850"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Supaio Development Line</title>
  <desc id="desc">
    A Japanese railway next-station display with a blinking yellow signal
    and a red arrow moving forward along a curved green route.
  </desc>

  <defs>
    <filter id="panelShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity=".35"
      />
    </filter>

    <filter id="signalGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!--
      Every station circle below is placed on an endpoint of this exact path.
      This keeps all points centered on the green route.
    -->
    <path
      id="routePath"
      d="
        M 70 292
        C 190 292, 300 310, 390 340
        C 500 375, 575 405, 650 430
        C 730 460, 785 500, 830 540
        C 890 590, 930 630, 960 660
        C 1000 700, 1025 735, 1040 760
        C 1060 790, 1075 815, 1085 835
      "
    />

    <style>
      .sans {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .jp {
        font-family:
          "Noto Sans JP",
          "Yu Gothic",
          "Hiragino Sans",
          "Microsoft YaHei",
          sans-serif;
      }

      .moving-arrow {
        transform-origin: 0 0;
        transform: translate(1070px, 815px) rotate(-122deg);
        animation: routeAdvance 9s linear infinite;
      }

      .signal {
        animation: signalBlink 1.25s ease-in-out infinite;
      }

      @keyframes routeAdvance {
        0%, 12% {
          transform: translate(1070px, 815px) rotate(-122deg);
        }
        20% {
          transform: translate(1040px, 760px) rotate(-122deg);
        }
        32% {
          transform: translate(960px, 660px) rotate(-136deg);
        }
        47% {
          transform: translate(830px, 540px) rotate(-145deg);
        }
        62% {
          transform: translate(650px, 430px) rotate(-160deg);
        }
        76% {
          transform: translate(390px, 340px) rotate(-166deg);
        }
        90%, 100% {
          transform: translate(70px, 292px) rotate(-175deg);
        }
      }

      @keyframes signalBlink {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: .32;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .moving-arrow,
        .signal {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- outer housing -->
  <rect width="1536" height="850" fill="#f1efe3"/>

  <g filter="url(#panelShadow)">
    <rect
      x="34"
      y="34"
      width="1468"
      height="782"
      fill="#ffffff"
      stroke="#111111"
      stroke-width="7"
    />
  </g>

  <!-- black information header -->
  <rect
    x="41"
    y="41"
    width="1454"
    height="238"
    fill="#292929"
  />

  <!-- left destination block -->
  <text
    class="sans"
    x="76"
    y="89"
    fill="#ffffff"
    font-size="25"
    font-weight="800"
    letter-spacing="2"
  >
    DEVELOPMENT
  </text>

  <text
    class="sans"
    x="76"
    y="123"
    fill="#ffffff"
    font-size="25"
    font-weight="800"
    letter-spacing="2"
  >
    LINE
  </text>

  <text
    class="sans"
    x="76"
    y="171"
    fill="#ffffff"
    font-size="34"
    font-weight="800"
  >
    FOUNDATIONS
  </text>

  <text
    class="sans"
    x="76"
    y="220"
    fill="#ffffff"
    font-size="34"
    font-weight="800"
  >
    SYSTEMS
  </text>

  <!-- vertical JR-style line color -->
  <rect
    x="370"
    y="41"
    width="64"
    height="238"
    fill="#5abc4b"
  />

  <!-- next station -->
  <text
    class="sans"
    x="462"
    y="97"
    fill="#ffffff"
    font-size="31"
    font-weight="800"
    letter-spacing="3"
  >
    NEXT
  </text>

  <text
    class="sans"
    x="820"
    y="213"
    text-anchor="middle"
    fill="#ffffff"
    font-size="112"
    font-weight="850"
    letter-spacing="9"
  >
    SUPAIO
  </text>

  <!-- right-side status -->
  <text
    class="sans"
    x="1286"
    y="103"
    text-anchor="end"
    fill="#ffffff"
    font-size="47"
    font-weight="500"
  >
    NOW
  </text>

  <text
    class="sans"
    x="1441"
    y="107"
    text-anchor="middle"
    fill="#ffffff"
    font-size="55"
    font-style="italic"
    font-weight="700"
  >
    01
  </text>

  <text
    class="sans"
    x="1441"
    y="143"
    text-anchor="middle"
    fill="#ffffff"
    font-size="20"
    font-weight="700"
  >
    TRACK
  </text>

  <!-- route border and route band -->
  <use
    href="#routePath"
    fill="none"
    stroke="#3f4345"
    stroke-width="142"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <use
    href="#routePath"
    fill="none"
    stroke="#58bd49"
    stroke-width="126"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- animated red direction arrow -->
  <g class="moving-arrow">
    <path
      d="
        M -47 -22
        H 4
        V -39
        L 54 0
        L 4 39
        V 22
        H -47
        Z
      "
      fill="#e60012"
      stroke="#ffffff"
      stroke-width="8"
      stroke-linejoin="round"
    />

  </g>

  <!-- station 12 -->
  <g>
    <circle
      cx="390"
      cy="340"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="390"
      y="354"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="850"
    >
      12
    </text>
    <text
      class="sans"
      x="453"
      y="302"
      fill="#111111"
      font-size="39"
      font-weight="800"
    >
      FOUNDATIONS
    </text>
  </g>

  <!-- station 10 -->
  <g>
    <circle
      cx="650"
      cy="430"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="650"
      y="444"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="850"
    >
      10
    </text>
    <text
      class="sans"
      x="711"
      y="391"
      fill="#111111"
      font-size="54"
      font-weight="850"
    >
      C
    </text>
  </g>

  <!-- station 8 -->
  <g>
    <circle
      cx="830"
      cy="540"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="830"
      y="554"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="850"
    >
      8
    </text>
    <text
      class="sans"
      x="893"
      y="501"
      fill="#111111"
      font-size="54"
      font-weight="850"
    >
      PYTHON
    </text>
  </g>

  <!-- station 5 -->
  <g>
    <circle
      cx="960"
      cy="660"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="960"
      y="674"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="850"
    >
      5
    </text>
    <text
      class="sans"
      x="1027"
      y="620"
      fill="#111111"
      font-size="54"
      font-weight="850"
    >
      GO
    </text>
  </g>

  <!-- blinking current-station signal -->
  <g class="signal" filter="url(#signalGlow)">
    <circle
      cx="1040"
      cy="760"
      r="47"
      fill="#ffe600"
      stroke="#ffffff"
      stroke-width="6"
    />

    <text
      class="sans"
      x="1040"
      y="777"
      text-anchor="middle"
      fill="#111111"
      font-size="49"
      font-weight="900"
    >
      1
    </text>
  </g>

  <text
    class="sans"
    x="1115"
    y="773"
    fill="#111111"
    font-size="54"
    font-weight="850"
  >
    SYSTEMS
  </text>

  <!-- transfer information -->
  <g>
    <text
      class="sans"
      x="72"
      y="483"
      fill="#111111"
      font-size="29"
      font-weight="850"
    >
      CONNECTIONS
    </text>

    <text
      class="sans"
      x="72"
      y="522"
      fill="#333333"
      font-size="24"
      font-weight="500"
    >
      Languages · Systems · Tooling
    </text>

    <rect
      x="76"
      y="551"
      width="34"
      height="18"
      fill="#ff7f50"
    />

    <rect
      x="76"
      y="569"
      width="34"
      height="18"
      fill="#334cff"
    />

    <text
      class="sans"
      x="124"
      y="575"
      fill="#222222"
      font-size="25"
      font-weight="700"
    >
      Windows · Linux
    </text>

    <rect
      x="76"
      y="608"
      width="34"
      height="34"
      fill="#334cff"
    />

    <text
      class="sans"
      x="124"
      y="636"
      fill="#222222"
      font-size="25"
      font-weight="700"
    >
      C · Python · Go
    </text>
  </g>

  <!-- footer note -->
  <text
    class="sans"
    x="64"
    y="797"
    fill="#333333"
    font-size="17"
    font-weight="600"
  >
    Travel times are symbolic. Progress may vary while learning.
  </text>
</svg>
