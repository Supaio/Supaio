<svg xmlns="http://www.w3.org/2000/svg"
     width="1536"
     height="850"
     viewBox="0 0 1536 850"
     role="img"
     aria-labelledby="title desc">

  <title id="title">スパイオ開発線</title>
  <desc id="desc">
    JR風の次駅案内表示。黄色い現在地表示が点滅し、
    赤い矢印が緑色の路線に沿って進みます。
  </desc>

  <defs>
    <filter id="panelShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity=".35"
      />
    </filter>

    <filter id="signalGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!--
      Every station circle below is placed on an endpoint of this exact path.
      This keeps all points centered on the green route.
    -->
    <path
      id="routePath"
      d="
        M 70 292
        C 190 292, 300 310, 390 340
        C 500 375, 575 405, 650 430
        C 730 460, 785 500, 830 540
        C 890 590, 930 630, 960 660
        C 1000 700, 1025 735, 1040 760
        C 1060 790, 1075 815, 1085 835
      "
    />

    <clipPath id="routeClip">
      <rect x="41" y="279" width="1454" height="530"/>
    </clipPath>

    <style>
      .sans {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .jp {
        font-family:
          "Noto Sans JP",
          "Noto Sans CJK JP",
          "Yu Gothic",
          "Hiragino Sans",
          Meiryo,
          "Microsoft YaHei",
          sans-serif;
      }

    </style>
  </defs>

  <!-- outer housing -->
  <rect width="1536" height="850" fill="#f1efe3"/>

  <g filter="url(#panelShadow)">
    <rect
      x="34"
      y="34"
      width="1468"
      height="782"
      fill="#ffffff"
      stroke="#111111"
      stroke-width="7"
    />
  </g>

  <!-- black information header -->
  <rect
    x="41"
    y="41"
    width="1454"
    height="238"
    fill="#292929"
  />

  <!-- left destination block -->
  <text
    class="jp"
    x="76"
    y="103"
    fill="#ffffff"
    font-size="41"
    font-weight="800"
  >
    開発線
  </text>

  <text
    class="jp"
    x="76"
    y="176"
    fill="#ffffff"
    font-size="39"
    font-weight="800"
  >
    基礎・システム
  </text>

  <text
    class="jp"
    x="335"
    y="224"
    text-anchor="end"
    fill="#ffffff"
    font-size="25"
    font-weight="700"
  >
    方面
  </text>

  <!-- vertical JR-style line color -->
  <rect
    x="370"
    y="41"
    width="64"
    height="238"
    fill="#5abc4b"
  />

  <!-- next station -->
  <text
    class="jp"
    x="462"
    y="99"
    fill="#ffffff"
    font-size="37"
    font-weight="800"
  >
    次は
  </text>

  <text
    class="jp"
    x="820"
    y="207"
    text-anchor="middle"
    fill="#ffffff"
    font-size="96"
    font-weight="800"
    letter-spacing="10"
  >
    スパイオ
  </text>

  <text
    class="sans"
    x="820"
    y="252"
    text-anchor="middle"
    fill="#ffffff"
    font-size="22"
    font-weight="700"
    letter-spacing="6"
  >
    SUPAIO
  </text>

  <!-- right-side status -->
  <text
    class="jp"
    x="1286"
    y="103"
    text-anchor="end"
    fill="#ffffff"
    font-size="42"
    font-weight="700"
  >
    現在
  </text>

  <text
    class="sans"
    x="1441"
    y="107"
    text-anchor="middle"
    fill="#ffffff"
    font-size="55"
    font-style="italic"
    font-weight="700"
  >
    01
  </text>

  <text
    class="jp"
    x="1441"
    y="146"
    text-anchor="middle"
    fill="#ffffff"
    font-size="20"
    font-weight="700"
  >
    番線
  </text>

  <!-- route and arrow stay clipped inside the white information panel -->
  <g clip-path="url(#routeClip)">
    <use
      href="#routePath"
      fill="none"
      stroke="#3f4345"
      stroke-width="142"
      stroke-linecap="butt"
      stroke-linejoin="round"
    />

    <use
      href="#routePath"
      fill="none"
      stroke="#58bd49"
      stroke-width="126"
      stroke-linecap="butt"
      stroke-linejoin="round"
    />

    <!--
      Native SVG transforms keep both the fallback and every animated frame
      on the route. The arrow never uses the document origin.
    -->
    <g transform="translate(1065 790)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          1065 790;
          1065 790;
          1040 760;
          960 660;
          830 540;
          650 430;
          390 340;
          70 292;
          70 292
        "
        keyTimes="0;.10;.18;.32;.47;.62;.77;.92;1"
        dur="9s"
        repeatCount="indefinite"
        calcMode="linear"
      />

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;.08;.88;1"
        dur="9s"
        repeatCount="indefinite"
      />

      <g transform="rotate(-122)">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="
            -122;
            -122;
            -122;
            -136;
            -145;
            -160;
            -166;
            -175;
            -175
          "
          keyTimes="0;.10;.18;.32;.47;.62;.77;.92;1"
          dur="9s"
          repeatCount="indefinite"
          calcMode="linear"
        />

        <path
          d="
            M -47 -22
            H 4
            V -39
            L 54 0
            L 4 39
            V 22
            H -47
            Z
          "
          fill="#e60012"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linejoin="round"
        />
      </g>
    </g>
  </g>

  <!-- station 12 -->
  <g>
    <circle
      cx="390"
      cy="340"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="390"
      y="354"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="800"
    >
      12
    </text>
    <text
      class="jp"
      x="560"
      y="323"
      fill="#111111"
      font-size="48"
      font-weight="800"
    >
      基礎
    </text>
  </g>

  <!-- station 10 -->
  <g>
    <circle
      cx="650"
      cy="430"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="650"
      y="444"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="800"
    >
      10
    </text>
    <text
      class="jp"
      x="711"
      y="395"
      fill="#111111"
      font-size="49"
      font-weight="800"
    >
      C言語
    </text>
  </g>

  <!-- station 8 -->
  <g>
    <circle
      cx="830"
      cy="540"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="830"
      y="554"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="800"
    >
      8
    </text>
    <text
      class="sans"
      x="893"
      y="500"
      fill="#111111"
      font-size="50"
      font-weight="800"
    >
      Python
    </text>
  </g>

  <!-- station 5 -->
  <g>
    <circle
      cx="960"
      cy="660"
      r="39"
      fill="#ffffff"
      stroke="#58bd49"
      stroke-width="5"
    />
    <text
      class="sans"
      x="960"
      y="674"
      text-anchor="middle"
      fill="#111111"
      font-size="43"
      font-weight="800"
    >
      5
    </text>
    <text
      class="sans"
      x="1027"
      y="620"
      fill="#111111"
      font-size="52"
      font-weight="800"
    >
      Go
    </text>
  </g>

  <!-- blinking current-station signal -->
  <g filter="url(#signalGlow)">
    <animate
      attributeName="opacity"
      values="1;.32;1"
      dur="1.25s"
      repeatCount="indefinite"
    />

    <circle
      cx="1040"
      cy="760"
      r="47"
      fill="#ffe600"
      stroke="#ffffff"
      stroke-width="6"
    />

    <text
      class="sans"
      x="1040"
      y="777"
      text-anchor="middle"
      fill="#111111"
      font-size="49"
      font-weight="900"
    >
      1
    </text>
  </g>

  <text
    class="jp"
    x="1115"
    y="773"
    fill="#111111"
    font-size="50"
    font-weight="800"
  >
    システム
  </text>

  <!-- transfer information -->
  <g>
    <text
      class="jp"
      x="72"
      y="483"
      fill="#111111"
      font-size="31"
      font-weight="800"
    >
      乗換えのご案内
    </text>

    <text
      class="jp"
      x="72"
      y="522"
      fill="#333333"
      font-size="24"
      font-weight="500"
    >
      言語・システム・ツール
    </text>

    <rect
      x="76"
      y="551"
      width="34"
      height="18"
      fill="#ff7f50"
    />

    <rect
      x="76"
      y="569"
      width="34"
      height="18"
      fill="#334cff"
    />

    <text
      class="sans"
      x="124"
      y="575"
      fill="#222222"
      font-size="25"
      font-weight="700"
    >
      Windows · Linux
    </text>

    <rect
      x="76"
      y="608"
      width="34"
      height="34"
      fill="#334cff"
    />

    <text
      class="sans"
      x="124"
      y="636"
      fill="#222222"
      font-size="25"
      font-weight="700"
    >
      C · Python · Go
    </text>
  </g>

  <!-- footer note -->
  <text
    class="jp"
    x="64"
    y="797"
    fill="#333333"
    font-size="17"
    font-weight="600"
  >
    所要時間は目安です。学習状況により変わります。
  </text>
</svg>
